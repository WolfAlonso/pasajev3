<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar · Pasaje Express</title>
  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../img/favicon.ico">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="../js/supabase.js?v=8"></script>
  <script src="../js/theme-loader.js?v=9"></script>
  <script src="../js/footer.js?v=4"></script>
  <script src="../js/express-sidebar.js?v=3"></script>
  <script src="../js/liquid-glass.js?v=4"></script>
  <script src="../js/delivery/delivery-radar.js?v=1"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #f0fdf4; }

    #radarMap { height: 380px; border-radius: 16px; z-index: 1; }
    @media (min-width: 768px) { #radarMap { height: 460px; } }
    .leaflet-container { font-family: 'Inter', sans-serif; border-radius: 16px; }

    .offer-card {
      border: 2px solid #e2e8f0;
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      transition: all .15s ease;
    }
    .offer-card:hover {
      border-color: #14b8a6;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -10px rgba(20, 184, 166, 0.4);
    }

    .pulse-dot {
      display: inline-block;
      width: 12px; height: 12px; border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulseDot 1.8s infinite;
    }
    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70%  { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <div id="expressSidebar"></div>

  <header class="glass-header text-white shadow-lg sticky top-0 z-40 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <button id="sidebarToggleBtn" type="button"
          onclick="if (window.PasajeExpressSidebar) window.PasajeExpressSidebar.toggle();"
          class="bg-white/10 hover:bg-white/20 p-2 rounded-xl transition border border-white/15 text-white lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a href="../index.html" class="flex items-center gap-2 text-lg font-extrabold min-w-0">
          <span class="truncate text-white">Pasaje de los <span class="text-emerald-400">Altos</span></span>
        </a>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white font-bold text-xs px-3 py-2 rounded-xl border border-white/15 flex items-center gap-1.5 transition">
          <span>➕</span><span class="hidden sm:inline">Nueva</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 w-full flex-1 space-y-5">

    <!-- HEADER radar -->
    <section class="bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
      <div class="bg-gradient-to-r from-teal-600 to-cyan-600 text-white p-4">
        <h1 class="font-black text-base flex items-center gap-2">
          <span class="pulse-dot"></span>
          Radar en Vivo
        </h1>
        <p class="text-xs text-white/90 mt-0.5">Actualizándose en tiempo real</p>
      </div>
      <div class="p-5">
        <div id="radarContent" class="hidden space-y-4">
          <div id="radarStatusHeader"></div>
          <div id="radarRouteCard"></div>
          <div id="radarOffers"></div>
          <div id="radarDriverCard"></div>
          <div id="radarPinCard"></div>
          <div id="radarCancelBtn"></div>
        </div>
      </div>
    </section>

    <!-- MAPA -->
    <section class="bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-sm font-black text-slate-900">🗺️ Mapa en vivo</h2>
        <span id="radarDistance" class="hidden text-[10px] font-black bg-teal-50 text-teal-700 px-3 py-1 rounded-full border border-teal-200"></span>
      </div>
      <div class="p-4">
        <div class="rounded-2xl overflow-hidden border-2 border-teal-200 shadow-inner">
          <div id="radarMap"></div>
        </div>
        <div class="mt-3 grid grid-cols-3 gap-2 text-[10px]">
          <div class="flex items-center gap-1.5 justify-center bg-teal-50 rounded-lg py-1.5 border border-teal-200">
            <span class="w-3 h-3 rounded-full bg-teal-500"></span><span class="font-bold text-teal-800">Origen</span>
          </div>
          <div class="flex items-center gap-1.5 justify-center bg-rose-50 rounded-lg py-1.5 border border-rose-200">
            <span class="w-3 h-3 rounded-full bg-rose-500"></span><span class="font-bold text-rose-800">Destino</span>
          </div>
          <div class="flex items-center gap-1.5 justify-center bg-purple-50 rounded-lg py-1.5 border border-purple-200">
            <span class="w-3 h-3 rounded-full bg-purple-500"></span><span class="font-bold text-purple-800">Piloto</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="pasajeFooter"></div>
</body>
</html>
