<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel Express · Pasaje Express</title>
  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../img/favicon.ico">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase.js?v=8"></script>
  <script src="../../js/theme-loader.js?v=9"></script>
  <script src="../../js/footer.js?v=4"></script>
  <script src="../../js/express-sidebar.js?v=3"></script>
  <script src="../../js/liquid-glass.js?v=4"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; background-color: #f0fdf4; }</style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <div id="expressSidebar"></div>

  <header class="glass-header text-white shadow-lg sticky top-0 z-40 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
      <button id="sidebarToggleBtn" type="button"
        onclick="if (window.PasajeExpressSidebar) window.PasajeExpressSidebar.toggle();"
        class="bg-white/10 hover:bg-white/20 p-2 rounded-xl border border-white/15 text-white lg:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="../../delivery/index.html" class="text-lg font-extrabold text-white">Pasaje Express · <span class="text-teal-300">Mi Panel</span></a>
      <a href="../../delivery/index.html" class="bg-white/10 hover:bg-white/20 text-white font-bold text-xs px-3 py-2 rounded-xl">➕ Nuevo</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 w-full flex-1 space-y-5 pb-16">

    <!-- MÉTRICAS -->
    <section class="grid grid-cols-3 gap-3">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 text-center shadow-sm">
        <p class="text-[10px] font-black text-slate-500 uppercase">Total viajes</p>
        <p id="statTotal" class="text-2xl font-black text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-emerald-50 rounded-2xl border border-emerald-200 p-4 text-center shadow-sm">
        <p class="text-[10px] font-black text-emerald-700 uppercase">Completados</p>
        <p id="statCompleted" class="text-2xl font-black text-emerald-700 mt-1">0</p>
      </div>
      <div class="bg-teal-50 rounded-2xl border border-teal-200 p-4 text-center shadow-sm">
        <p class="text-[10px] font-black text-teal-700 uppercase">Total gastado</p>
        <p id="statSpent" class="text-2xl font-black text-teal-700 mt-1">Q0</p>
      </div>
    </section>

    <!-- TABS -->
    <div class="bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-3 gap-1 text-xs font-black">
      <button class="tab-btn active" data-tab="viajes" style="padding:10px 12px;border-radius:12px;background:#0f172a;color:#fff;">📜 Mis Viajes</button>
      <button class="tab-btn" data-tab="direcciones" style="padding:10px 12px;border-radius:12px;color:#475569;">📍 Direcciones</button>
      <button class="tab-btn" data-tab="cupones" style="padding:10px 12px;border-radius:12px;color:#475569;">🎟️ Cupones</button>
    </div>

    <!-- TAB: VIAJES -->
    <section id="tab-viajes" class="space-y-3">
      <div id="tripsList" class="space-y-3">
        <p class="text-center text-slate-400 text-sm py-6">Cargando...</p>
      </div>
    </section>

    <!-- TAB: DIRECCIONES -->
    <section id="tab-direcciones" class="space-y-3 hidden">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="font-black text-sm text-slate-900">📍 Direcciones frecuentes</h2>
          <button id="btnAddAddress" class="text-xs font-bold bg-teal-50 hover:bg-teal-100 text-teal-700 px-3 py-1.5 rounded-xl border border-teal-200">➕ Añadir</button>
        </div>
        <div id="addressList" class="space-y-2">
          <p class="text-center text-slate-400 text-xs py-4">Cargando...</p>
        </div>
      </div>
    </section>

    <!-- TAB: CUPONES -->
    <section id="tab-cupones" class="space-y-3 hidden">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
        <h2 class="font-black text-sm text-slate-900">🎟️ Cupones disponibles</h2>
        <div id="couponsList" class="space-y-2">
          <p class="text-center text-slate-400 text-xs py-4">Cargando...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL DIRECCIÓN -->
  <div id="addressModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-4 border border-slate-100">
      <h3 class="font-black text-slate-900 text-base">📍 Nueva dirección</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Etiqueta</label>
          <input id="addrLabel" type="text" placeholder="Casa, Trabajo..." maxlength="40"
            class="w-full border border-slate-200 p-2.5 rounded-xl text-sm font-semibold bg-slate-50 outline-none focus:ring-2 focus:ring-teal-500">
        </div>
        <div>
          <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Dirección</label>
          <input id="addrText" type="text" placeholder="Ej. 14 Av 4-12 Zona 1"
            class="w-full border border-slate-200 p-2.5 rounded-xl text-sm font-semibold bg-slate-50 outline-none focus:ring-2 focus:ring-teal-500">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button id="btnCancelAddr" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs">Cancelar</button>
        <button id="btnSaveAddr" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-2.5 rounded-xl text-xs">Guardar</button>
      </div>
    </div>
  </div>

  <div id="pasajeFooter"></div>

  <script>
    (async () => {
      const c = window._supabase;
      const { data: { session } } = await c.auth.getSession();
      if (!session) {
        window.location.href = '../../login.html?redirect=' + encodeURIComponent('delivery/dashboard/cliente.html');
        return;
      }
      window.__user = session.user;

      await loadTrips();
      bindTabs();
      bindAddressModal();
      loadAddresses();
      loadCoupons();

      // Realtime
      if (window.PasajeRealtime) {
        const debounced = PasajeRealtime.debounce(loadTrips, 2000);
        PasajeRealtime.subscribeToTable('cli_dash_requests', 'delivery_requests',
          `customer_user_id=eq.${session.user.id}`, debounced);
      }
    })();

    function bindTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach(b => {
            b.style.background = '';
            b.style.color = '#475569';
            b.classList.remove('active');
          });
          btn.style.background = '#0f172a';
          btn.style.color = '#fff';
          btn.classList.add('active');

          document.querySelectorAll('[id^="tab-"]').forEach(s => s.classList.add('hidden'));
          document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
        };
      });
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fmtMoney(n) { return `Q${parseFloat(n || 0).toFixed(2)}`; }
    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('es-GT',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' · '
        + d.toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',hour12:true});
    }

    async function loadTrips() {
      const c = window._supabase;
      const user = window.__user;
      const { data } = await c.from('delivery_requests')
        .select('*')
        .eq('customer_user_id', user.id)
        .order('created_at', { ascending: false })
        .limit(50);

      const list = data || [];
      const completed = list.filter(r => ['delivered','completed'].includes(r.status)).length;
      const spent = list.filter(r => ['delivered','completed'].includes(r.status))
        .reduce((s, r) => s + parseFloat(r.final_fee || r.suggested_fee || 0), 0);

      document.getElementById('statTotal').textContent = list.length;
      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statSpent').textContent = `Q${spent.toFixed(0)}`;

      const listEl = document.getElementById('tripsList');
      if (!list.length) {
        listEl.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center">
            <div class="text-4xl mb-2">📭</div>
            <p class="font-black text-slate-700 text-sm">Aún no tienes encargos</p>
            <a href="../../delivery/index.html" class="inline-block mt-3 bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl">➕ Crear el primero</a>
          </div>`;
        return;
      }

      const statusMap = {
        pending: 'bg-amber-100 text-amber-800',
        counter_offered: 'bg-blue-100 text-blue-800',
        accepted: 'bg-teal-100 text-teal-800',
        in_transit: 'bg-purple-100 text-purple-800',
        on_the_way: 'bg-purple-100 text-purple-800',
        delivered: 'bg-emerald-100 text-emerald-800',
        completed: 'bg-emerald-100 text-emerald-800',
        cancelled: 'bg-rose-100 text-rose-800',
        cancelled_pending_review: 'bg-amber-100 text-amber-900'
      };
      const labelMap = {
        pending: '⏳ Pendiente',
        counter_offered: '🔥 Con ofertas',
        accepted: '✅ Aceptado',
        in_transit: '🛵 En tránsito',
        on_the_way: '🛵 En camino',
        delivered: '🎉 Entregado',
        completed: '🎉 Completado',
        cancelled: '❌ Cancelado',
        cancelled_pending_review: '⚠️ En revisión'
      };

      listEl.innerHTML = list.map(r => {
        const isActive = ['pending','counter_offered','accepted','in_transit','on_the_way'].includes(r.status);
        const cls = statusMap[r.status] || 'bg-slate-100 text-slate-700';
        const lbl = labelMap[r.status] || r.status;
        return `
          <article class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
            <div class="flex justify-between items-start border-b pb-3">
              <div class="min-w-0">
                <span class="text-[10px] font-mono text-slate-400">#${esc(String(r.id).slice(0,8).toUpperCase())}</span>
                <p class="font-black text-xs text-slate-900 mt-0.5 truncate">📍 ${esc(r.origin_address || '')}</p>
                <p class="font-black text-xs text-slate-900 truncate">🎯 ${esc(r.destination_address || '')}</p>
                <p class="text-[10px] text-slate-500 mt-1">${fmtDate(r.created_at)}</p>
              </div>
              <span class="text-[10px] font-black px-2 py-1 rounded-full uppercase ${cls} flex-shrink-0">${lbl}</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-slate-500">${r.driver_id ? 'Con piloto asignado' : 'Sin piloto'}</span>
              <span class="font-black text-teal-600">${fmtMoney(r.final_fee || r.suggested_fee || 0)}</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
              ${isActive ? `<a href="../../delivery/radar.html?id=${r.id}" class="text-center bg-teal-50 hover:bg-teal-100 text-teal-700 font-extrabold py-2 rounded-xl text-xs border border-teal-200">📡 Ver radar</a>`
                : `<a href="../../delivery/index.html" class="text-center bg-slate-50 hover:bg-slate-100 text-slate-600 font-extrabold py-2 rounded-xl text-xs border border-slate-200">🧾 Repetir</a>`}
              <button data-action="recibo" data-req="${r.id}" class="bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-2 rounded-xl text-xs">🧾 Recibo</button>
            </div>
          </article>
        `;
      }).join('');

      listEl.querySelectorAll('[data-action="recibo"]').forEach(btn => {
        btn.onclick = () => {
          const r = list.find(x => String(x.id) === String(btn.dataset.req));
          if (r) showReceipt(r);
        };
      });
    }

    function showReceipt(r) {
      alert(`🧾 RECIBO\n\nTicket: ${String(r.id).slice(0,8).toUpperCase()}\nOrigen: ${r.origin_address}\nDestino: ${r.destination_address}\nTarifa: Q${parseFloat(r.final_fee || r.suggested_fee || 0).toFixed(2)}\nEstado: ${r.status}\nFecha: ${fmtDate(r.created_at)}`);
    }

    // -------------------- DIRECCIONES --------------------
    async function loadAddresses() {
      const c = window._supabase;
      const user = window.__user;
      const listEl = document.getElementById('addressList');

      const { data } = await c.from('saved_addresses')
        .select('*').eq('user_id', user.id)
        .order('created_at', { ascending: false });

      const list = data || [];
      if (!list.length) {
        listEl.innerHTML = `<p class="text-center text-slate-400 text-xs py-4">Sin direcciones guardadas</p>`;
        return;
      }
      listEl.innerHTML = list.map(a => `
        <div class="flex items-center justify-between border border-slate-200 rounded-xl p-3">
          <div class="min-w-0">
            <p class="font-black text-xs text-slate-900">${esc(a.label)}</p>
            <p class="text-[11px] text-slate-600 truncate">${esc(a.address_text)}</p>
          </div>
          <button data-del="${a.id}" class="text-xs text-rose-600 hover:bg-rose-50 px-2.5 py-1.5 rounded-lg">🗑️</button>
        </div>
      `).join('');

      listEl.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm('¿Eliminar esta dirección?')) return;
          await c.from('saved_addresses').delete().eq('id', btn.dataset.del);
          loadAddresses();
        };
      });
    }

    function bindAddressModal() {
      document.getElementById('btnAddAddress').onclick = () => {
        document.getElementById('addrLabel').value = '';
        document.getElementById('addrText').value = '';
        document.getElementById('addressModal').classList.remove('hidden');
      };
      document.getElementById('btnCancelAddr').onclick = () =>
        document.getElementById('addressModal').classList.add('hidden');
      document.getElementById('btnSaveAddr').onclick = async () => {
        const label = document.getElementById('addrLabel').value.trim();
        const text = document.getElementById('addrText').value.trim();
        if (!label || !text) { alert('Completa etiqueta y dirección.'); return; }

        const { error } = await window._supabase.from('saved_addresses').insert([{
          user_id: window.__user.id, label, address_text: text
        }]);
        if (error) { alert('Error: ' + error.message); return; }
        document.getElementById('addressModal').classList.add('hidden');
        loadAddresses();
      };
    }

    // -------------------- CUPONES --------------------
    async function loadCoupons() {
      const c = window._supabase;
      const listEl = document.getElementById('couponsList');
      const { data } = await c.from('coupons')
        .select('code, discount_type, discount_value, min_purchase, expires_at, is_active, is_express_coupon')
        .eq('is_active', true)
        .eq('is_express_coupon', true)
        .order('created_at', { ascending: false })
        .limit(20);

      const list = (data || []).filter(cp => !cp.expires_at || new Date(cp.expires_at) > new Date());
      if (!list.length) {
        listEl.innerHTML = `<p class="text-center text-slate-400 text-xs py-4">Sin cupones disponibles</p>`;
        return;
      }
      listEl.innerHTML = list.map(cp => {
        const disc = cp.discount_type === 'percentage'
          ? `-${parseFloat(cp.discount_value)}%`
          : `-Q${parseFloat(cp.discount_value).toFixed(2)}`;
        return `
          <div class="flex items-center justify-between border-2 border-dashed border-teal-300 bg-teal-50/60 rounded-xl p-3">
            <div>
              <p class="font-black text-sm text-teal-700 tracking-wider">${esc(cp.code)}</p>
              <p class="text-[10px] text-teal-600">Mínimo: Q${parseFloat(cp.min_purchase || 0).toFixed(2)}</p>
            </div>
            <span class="text-lg font-black text-teal-700">${disc}</span>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
