<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../img/favicon.ico">
  <title>Kit Imprimible QR · Pasaje de los Altos</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=4"></script>

  <script src="../js/theme-loader.js?v=4"></script>
  <script src="../js/dashboard-utils.js?v=4"></script>
  <script src="../js/dashboard-sidebar.js?v=5"></script>
  <script src="../js/liquid-glass.js?v=4"></script>

  <!-- LIBRERÍA GENERADORA DE CÓDIGOS QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* REGLAS DE IMPRESIÓN CORREGIDAS */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printArea, #printArea * {
        visibility: visible !important;
      }
      #printArea {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      @page {
        size: auto;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <div id="dashboardHeader" class="no-print"></div>

  <main class="max-w-6xl mx-auto p-4 no-print pb-16">
    <div id="dashboardTabs"></div>

    <div id="loadingState" class="bg-white rounded-2xl p-8 text-center text-sm text-slate-500 shadow-sm border border-slate-200">
      Cargando generador de material publicitario...
    </div>

    <section id="content" class="hidden space-y-6">
      
      <!-- Panel de Controles -->
      <div class="bg-white/90 backdrop-blur rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b pb-4">
          <div>
            <h1 class="text-xl font-black text-slate-900 flex items-center gap-2">
              <span>🖨️</span> Generador de Material Publicitario Físico
            </h1>
            <p class="text-xs font-semibold text-slate-500 mt-0.5">Imprime tu Kit Publicitario con Código QR para tu mostrador, empaques y clientes.</p>
          </div>

          <button onclick="window.print()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs px-5 py-3 rounded-xl transition shadow flex items-center justify-center gap-2">
            <span>🖨️ Imprimir Kit Publicitario</span>
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Formato de Imprimible</label>
            <select id="templateTypeSelect" class="w-full border border-slate-300 p-2.5 rounded-xl text-xs font-bold bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="hablador">📍 Hablador de Mostrador (A5 / Media Carta)</option>
              <option value="stickers">🏷️ Planilla de Stickers (12 por hoja)</option>
              <option value="tarjetas">💳 Tarjetas de Presentación (10 por hoja)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mensaje Llamativo (CTA)</label>
            <input type="text" id="ctaTextInput" value="¡Escanea aquí y mira nuestro catálogo online!"
              class="w-full border border-slate-300 p-2.5 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Enlace Directo</label>
            <input type="text" id="storeUrlDisplay" readonly
              class="w-full bg-slate-100 border border-slate-200 p-2.5 rounded-xl text-xs font-bold text-slate-600 outline-none">
          </div>
        </div>
      </div>

      <!-- VISTA PREVIA INTERACTIVA -->
      <div class="bg-slate-200/60 rounded-3xl p-6 border border-slate-300/80 flex flex-col items-center justify-center min-h-[400px]">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Vista Previa de Impresión</span>
        <div id="previewContainer" class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-6 border border-slate-200"></div>
      </div>

    </section>
  </main>

  <!-- ÁREA EXCLUSIVA DE IMPRESIÓN -->
  <div id="printArea" style="display: none;"></div>

  <script>
    let currentStore = null;
    let qrCanvasDataUrl = '';

    (async () => {
      const { session, store } = await guardDashboardPage();
      if (!session || !store) return;

      // FORZAR REFRESCO DE DATOS DE LA TIENDA DESDE SUPABASE
      const { data: freshStore } = await _supabase
        .from('stores')
        .select('*')
        .eq('id', store.id)
        .single();

      currentStore = freshStore || store;

      await initDashboardNav({ store: currentStore, user: session.user });

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      const storePublicUrl = `${window.location.origin}/tienda.html?slug=${encodeURIComponent(currentStore.slug)}`;
      document.getElementById('storeUrlDisplay').value = storePublicUrl;

      generateQR(storePublicUrl);

      document.getElementById('templateTypeSelect').addEventListener('change', renderPreview);
      document.getElementById('ctaTextInput').addEventListener('input', renderPreview);
    })();

    function generateQR(text) {
      const tempDiv = document.createElement('div');
      tempDiv.style.display = 'none';
      document.body.appendChild(tempDiv);

      new QRCode(tempDiv, {
        text: text,
        width: 300,
        height: 300,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => {
        const img = tempDiv.querySelector('img');
        const canvas = tempDiv.querySelector('canvas');
        if (img && img.src) {
          qrCanvasDataUrl = img.src;
        } else if (canvas) {
          qrCanvasDataUrl = canvas.toDataURL("image/png");
        }
        document.body.removeChild(tempDiv);
        renderPreview();
      }, 150);
    }

    function renderPreview() {
      const templateType = document.getElementById('templateTypeSelect').value;
      const ctaText = dashEscapeHtml(document.getElementById('ctaTextInput').value || '¡Escanea para pedir!');
      const storeName = dashEscapeHtml(currentStore.name);
      const storeLogo = currentStore.logo_url || '../img/logo.png';
      const zoneText = dashEscapeHtml(currentStore.zone || 'Quetzaltenango');
      const addressText = dashEscapeHtml(currentStore.address_details || currentStore.address || 'Xela');

      let html = '';

      if (templateType === 'hablador') {
        html = `
          <div class="border-4 border-slate-900 rounded-3xl p-8 text-center space-y-4 max-w-md mx-auto bg-gradient-to-b from-slate-50 to-white shadow-lg">
            <div class="flex items-center justify-center gap-3">
              <img src="${storeLogo}" class="w-16 h-16 rounded-full border-2 border-slate-900 object-cover bg-white">
              <div class="text-left">
                <h2 class="text-xl font-black text-slate-900 leading-tight">${storeName}</h2>
                <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">📍 ${zoneText}</span>
              </div>
            </div>

            <div class="py-2">
              <p class="text-sm font-extrabold text-slate-800 uppercase tracking-wide mb-3">${ctaText}</p>
              <div class="p-3 bg-white border-2 border-slate-900 rounded-2xl inline-block shadow-md">
                <img src="${qrCanvasDataUrl}" class="w-48 h-48 mx-auto">
              </div>
            </div>

            <div class="border-t border-slate-200 pt-3">
              <p class="text-[11px] font-semibold text-slate-600">🏢 ${addressText}</p>
              <p class="text-[10px] font-black text-slate-400 mt-1 uppercase tracking-widest">Pasaje de los Altos · Catálogo Digital</p>
            </div>
          </div>`;
      } else if (templateType === 'stickers') {
        const stickersHTML = Array(12).fill(0).map(() => `
          <div class="border-2 border-dashed border-slate-400 rounded-2xl p-2.5 text-center flex flex-col items-center justify-center bg-white aspect-square">
            <img src="${storeLogo}" class="w-7 h-7 rounded-full object-cover mb-1 border border-slate-300" onerror="this.style.display='none'">
            <h4 class="text-[10px] font-black text-slate-900 truncate max-w-full">${storeName}</h4>
            <img src="${qrCanvasDataUrl}" class="w-16 h-16 my-1">
            <p class="text-[8px] font-extrabold text-emerald-700 uppercase">Escanea y Pide</p>
          </div>`).join('');

        html = `
          <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
            ${stickersHTML}
          </div>`;
      } else if (templateType === 'tarjetas') {
        const cardsHTML = Array(10).fill(0).map(() => `
          <div class="border-2 border-slate-800 rounded-xl p-3 flex items-center justify-between gap-2 bg-white">
            <div class="min-w-0 flex-1">
              <h4 class="text-xs font-black text-slate-900 truncate">${storeName}</h4>
              <p class="text-[9px] text-emerald-700 font-bold mt-0.5">📱 +${dashEscapeHtml(currentStore.whatsapp || '')}</p>
              <p class="text-[9px] text-slate-500 font-medium truncate mt-0.5">📍 ${zoneText}</p>
              <p class="text-[8px] font-bold text-slate-400 uppercase mt-1">Escanea nuestro catálogo</p>
            </div>
            <img src="${qrCanvasDataUrl}" class="w-16 h-16 border rounded p-0.5 bg-white flex-shrink-0">
          </div>`).join('');

        html = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${cardsHTML}
          </div>`;
      }

      document.getElementById('previewContainer').innerHTML = html;
      document.getElementById('printArea').innerHTML = html;
    }
  </script>
</body>
</html>
