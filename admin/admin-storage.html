<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage · Admin</title>
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../img/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/theme-loader.js?v=2"></script>
  <script src="../js/admin-utils.js"></script>
  <script src="../js/admin-sidebar.js?v=1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div id="adminHeader"></div>

  <main class="max-w-7xl mx-auto p-4">
    <div id="adminTabs"></div>

    <div id="loadingState" class="bg-white rounded-xl shadow-sm border p-8 text-center text-sm text-gray-500">Cargando...</div>

    <section id="content" class="hidden space-y-4">
      <div class="bg-white rounded-xl shadow-sm border p-4">
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
          <select id="bucketSelect"
            class="border border-gray-300 p-2.5 rounded-lg text-sm bg-white focus:ring-2 focus:ring-amber-500 outline-none">
            <option value="products">Bucket: products (5 MB)</option>
            <option value="logos">Bucket: logos (2 MB)</option>
          </select>
          <div class="flex-1 flex items-center gap-2 min-w-0">
            <button id="storageBackBtn"
              class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-2 rounded-lg transition">← Atrás</button>
            <p class="text-xs text-gray-500 truncate">Ruta: <span id="storagePath" class="font-mono font-semibold text-gray-800">/</span></p>
          </div>
          <button id="storageRefreshBtn"
            class="bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold px-3 py-2 rounded-lg transition">🔄 Refrescar</button>
        </div>
      </div>

      <div id="storageList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
        <p class="col-span-full p-8 text-center text-sm text-gray-500">Cargando archivos...</p>
      </div>
    </section>
  </main>

  <script>
    let currentBucket = 'products';
    let currentStoragePath = '';

    (async () => {
      const session = await adminGuardPage();
      if (!session) return;
      await initAdminNav({ user: session.user });

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      await loadStorage();

      document.getElementById('bucketSelect').addEventListener('change', (e) => {
        currentBucket = e.target.value;
        currentStoragePath = '';
        loadStorage();
      });
      document.getElementById('storageRefreshBtn').addEventListener('click', loadStorage);
      document.getElementById('storageBackBtn').addEventListener('click', () => {
        const parts = currentStoragePath.split('/').filter(Boolean);
        parts.pop();
        currentStoragePath = parts.join('/');
        loadStorage();
      });
    })();

    async function loadStorage() {
      const container = document.getElementById('storageList');
      const e = adminEscapeHtml;
      container.innerHTML = '<p class="col-span-full p-8 text-center text-sm text-gray-500">Cargando archivos...</p>';

      document.getElementById('storagePath').textContent = '/' + (currentStoragePath || '');
      const backBtn = document.getElementById('storageBackBtn');
      if (currentStoragePath) backBtn.classList.remove('hidden');
      else backBtn.classList.add('hidden');

      const { data, error } = await _supabase.storage
        .from(currentBucket)
        .list(currentStoragePath, { limit: 200, offset: 0, sortBy: { column: 'name', order: 'asc' } });

      if (error) {
        container.innerHTML = '<p class="col-span-full p-8 text-center text-sm text-red-500">Error al cargar archivos.</p>';
        console.error(error);
        return;
      }

      const items = (data || []).filter(i => i.name && i.name !== '.emptyFolderPlaceholder');

      if (items.length === 0) {
        container.innerHTML = `<div class="col-span-full p-10 text-center">
          <div class="text-4xl mb-2">📂</div>
          <p class="text-sm text-gray-500">Esta carpeta está vacía.</p>
        </div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const isFolder = item.id === null;
        const fullPath = currentStoragePath ? `${currentStoragePath}/${item.name}` : item.name;

        if (isFolder) {
          return `<div data-folder="${e(item.name)}"
            class="bg-white rounded-xl border shadow-sm p-3 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-amber-50 hover:border-amber-300 transition min-h-[140px]">
            <div class="text-4xl mb-2">📁</div>
            <p class="text-xs font-semibold text-gray-800 break-all line-clamp-2">${e(item.name)}</p>
            <p class="text-[10px] text-gray-400 mt-1">Carpeta</p>
          </div>`;
        }

        const { data: urlData } = _supabase.storage.from(currentBucket).getPublicUrl(fullPath);
        const publicUrl = urlData?.publicUrl || '';
        const isImage = /\.(jpg|jpeg|png|webp|gif|avif|svg)$/i.test(item.name);

        return `<div class="bg-white rounded-xl border shadow-sm overflow-hidden flex flex-col">
          <div class="aspect-square bg-gray-100 flex items-center justify-center overflow-hidden">
            ${isImage
              ? `<img src="${publicUrl}" alt="${e(item.name)}"
                      onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}'"
                      class="w-full h-full object-cover" loading="lazy">`
              : `<div class="text-4xl text-gray-400">📄</div>`}
          </div>
          <div class="p-2 flex-1 flex flex-col">
            <p class="text-[11px] font-semibold text-gray-800 break-all line-clamp-2" title="${e(item.name)}">${e(item.name)}</p>
            <p class="text-[10px] text-gray-400 mt-0.5">${item.metadata?.size ? (item.metadata.size / 1024).toFixed(1) + ' KB' : '—'}</p>
            <div class="flex gap-1 mt-2">
              <a href="${publicUrl}" target="_blank" rel="noopener"
                 class="flex-1 text-center text-[10px] bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-1.5 rounded-lg">Ver</a>
              <button data-delete-file="${e(fullPath)}"
                class="flex-1 text-[10px] bg-red-50 hover:bg-red-100 text-red-600 font-bold py-1.5 rounded-lg">🗑️</button>
            </div>
          </div>
        </div>`;
      }).join('');

      container.querySelectorAll('[data-folder]').forEach(el => {
        el.addEventListener('click', () => {
          const name = el.dataset.folder;
          currentStoragePath = currentStoragePath ? `${currentStoragePath}/${name}` : name;
          loadStorage();
        });
      });

      container.querySelectorAll('[data-delete-file]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const path = btn.dataset.deleteFile;
          if (!confirm(`¿Eliminar "${path}"? Esta acción no se puede deshacer.`)) return;
          btn.disabled = true;
          const { error } = await _supabase.storage.from(currentBucket).remove([path]);
          if (error) { alert('Error: ' + error.message); btn.disabled = false; return; }
          await loadStorage();
        });
      });
    }
  </script>
</body>
</html>
