<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inmuebles Admin</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../img/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase.js?v=8"></script>
  <script src="../../js/theme-loader.js?v=9"></script>
  <script src="../../js/admin-utils.js?v=8"></script>
  <script src="../../js/admin-sidebar.js?v=3"></script>
  <script src="../../js/liquid-glass.js?v=4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="adminHeader"></div>
  <main class="max-w-7xl mx-auto p-4 pb-16">
    <div id="adminTabs"></div>
    <div id="loadingState" class="rounded-2xl p-8 text-center text-sm text-slate-500 bg-white shadow-sm">Verificando permisos...</div>
    <section id="content" class="hidden space-y-5">
      <div class="bg-white rounded-2xl p-5 shadow-sm border">
        <h1 class="text-xl font-black text-slate-900">🏠 Admin Inmuebles</h1>
        <p class="text-xs text-slate-500 mt-1">Centro de administración del módulo inmobiliario</p>
      </div>
      <div class="bg-white rounded-2xl p-8 shadow-sm border text-center">
        <div class="text-5xl mb-3">🚧</div>
        <p class="font-black text-slate-700">En construcción</p>
        <p class="text-xs text-slate-500 mt-1">Próximamente: gestión de propiedades, agencias y zonas</p>
      </div>
    </section>
  </main>
  <script>
    (async () => {
      const session = await adminGuardPage();
      if (!session) return;
      await initAdminNav({ user: session.user });
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
    })();
  </script>
</body>
</html>
