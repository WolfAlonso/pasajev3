<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flota Express · Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=8"></script>
  <script src="../js/theme-loader.js?v=9"></script>
  <script src="../js/admin-utils.js?v=8"></script>
  <script src="../js/admin-delivery-sidebar.js?v=1"></script>
  <script src="../js/liquid-glass.js?v=4"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <div id="adminHeader"></div>

  <main class="max-w-7xl mx-auto p-4 pb-16">
    <div id="adminTabs"></div>
    <div id="loadingState" class="glass-container rounded-2xl p-8 text-center text-sm text-slate-500">
      Verificando acceso de administrador de flota...
    </div>
    <section id="content" class="hidden">
      <!-- Tu contenido del panel de flota -->
    </section>
  </main>

  <script>
    (async () => {
      const session = await adminGuardPage();
      if (!session) return;
      await initAdminDeliveryNav({ user: session.user });
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      // Tu lógica de carga aquí
    })();
  </script>
</body>
</html>
