<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría · Flota Express</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../img/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase.js?v=8"></script>
  <script src="../../js/theme-loader.js?v=9"></script>
  <script src="../../js/admin-utils.js?v=8"></script>
  <script src="../../js/admin-delivery-sidebar.js?v=2"></script>
  <script src="../../js/liquid-glass.js?v=4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="adminHeader"></div>
  <main class="max-w-7xl mx-auto p-4 pb-16">
    <div id="adminTabs"></div>
    <div id="loadingState" class="rounded-2xl p-8 text-center text-sm text-slate-500 bg-white shadow-sm">Cargando auditoría...</div>
    <section id="content" class="hidden space-y-5">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="text-xl font-black text-slate-900">⚠️ Auditoría de Disputas</h1>
          <p class="text-xs text-slate-500 mt-1">Cancelaciones pendientes de revisión y sanciones aplicadas</p>
        </div>
        <button onclick="loadAudit()" class="text-xs font-bold bg-slate-900 text-white px-3 py-1.5 rounded-xl">🔄 Actualizar</button>
      </div>
      <div id="auditList" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden divide-y divide-slate-100">
        <p class="p-8 text-center text-sm text-slate-500">Cargando...</p>
      </div>
    </section>
  </main>
  <script>
    (async () => {
      const session = await adminGuardPage();
      if (!session) return;
      await initAdminDeliveryNav({ user: session.user });
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      loadAudit();
    })();

    async function loadAudit() {
      const c = window._supabase;
      const { data } = await c.from('delivery_requests')
        .select('*, stores(name), driver:delivery_drivers!delivery_requests_driver_id_fkey(full_name)')
        .not('cancelled_at', 'is', null)
        .order('cancelled_at', { ascending: false })
        .limit(100);

      const list = document.getElementById('auditList');
      if (!data || !data.length) {
        list.innerHTML = '<p class="p-8 text-center text-sm text-slate-500">Sin disputas registradas</p>';
        return;
      }
      list.innerHTML = data.map(r => {
        const status = r.admin_resolution || 'pending';
        const badge = {
          'pending': 'bg-amber-100 text-amber-800 border-amber-300',
          'approved_no_sanction': 'bg-emerald-100 text-emerald-800 border-emerald-300',
          'warning_24h': 'bg-amber-100 text-amber-900 border-amber-300',
          'suspension_7d': 'bg-rose-100 text-rose-800 border-rose-300',
          'revoked': 'bg-slate-200 text-slate-800 border-slate-300'
        }[status] || 'bg-slate-100 text-slate-700';

        return `
          <div class="p-4">
            <div class="flex justify-between items-start flex-wrap gap-3">
              <div class="min-w-0">
                <p class="font-mono text-[10px] text-slate-400">#${(r.id||'').slice(0,8).toUpperCase()}</p>
                <p class="font-black text-xs text-slate-900">🏪 ${r.stores?.name || 'Pasaje Express'} · 🛵 ${r.driver?.full_name || 'Sin piloto'}</p>
                <p class="text-[11px] text-slate-600 mt-1">Emisor: <strong>${r.cancelled_by_role === 'seller' ? '🏪 Vendedor' : r.cancelled_by_role === 'customer' ? '👤 Cliente' : '🛵 Piloto'}</strong></p>
                <p class="text-[11px] text-slate-600 italic mt-1">"${r.cancellation_reason || 'Sin motivo'}"</p>
              </div>
              <span class="text-[10px] font-black px-2.5 py-1 rounded-full border ${badge} uppercase">${status}</span>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
