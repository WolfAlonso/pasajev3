<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flota Express · Dashboard</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../img/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase.js?v=8"></script>
  <script src="../../js/theme-loader.js?v=9"></script>
  <script src="../../js/admin-utils.js?v=8"></script>
  <script src="../../js/admin-delivery-sidebar.js?v=2"></script>
  <script src="../../js/liquid-glass.js?v=4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <div id="adminHeader"></div>

  <main class="max-w-7xl mx-auto p-4 pb-16">
    <div id="adminTabs"></div>

    <div id="loadingState" class="rounded-2xl p-8 text-center text-sm text-slate-500 bg-white shadow-sm">
      Cargando dashboard de flota...
    </div>

    <section id="content" class="hidden space-y-5">

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <h1 class="text-xl font-black text-slate-900">📊 Dashboard de Flota</h1>
        <p class="text-xs text-slate-500 mt-1">Métricas en tiempo real de Pasaje Express</p>
      </div>

      <!-- Métricas -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
          <p class="text-[10px] font-black text-slate-500 uppercase">🛵 Pilotos activos</p>
          <p id="statActiveDrivers" class="text-3xl font-black text-teal-600 mt-1">—</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-amber-200 bg-amber-50/30">
          <p class="text-[10px] font-black text-amber-700 uppercase">⏳ En curso</p>
          <p id="statActiveRequests" class="text-3xl font-black text-amber-700 mt-1">—</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-emerald-200 bg-emerald-50/30">
          <p class="text-[10px] font-black text-emerald-700 uppercase">✅ Hoy completados</p>
          <p id="statTodayCompleted" class="text-3xl font-black text-emerald-700 mt-1">—</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-rose-200 bg-rose-50/30">
          <p class="text-[10px] font-black text-rose-700 uppercase">⚠️ Disputas</p>
          <p id="statPendingAudit" class="text-3xl font-black text-rose-700 mt-1">—</p>
        </div>
      </div>

      <!-- Facturación -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
          <p class="text-[10px] font-black text-slate-500 uppercase">💰 Facturado hoy</p>
          <p id="statTodayRevenue" class="text-2xl font-black text-slate-900 mt-1">Q0.00</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
          <p class="text-[10px] font-black text-slate-500 uppercase">📈 Facturado semana</p>
          <p id="statWeekRevenue" class="text-2xl font-black text-slate-900 mt-1">Q0.00</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
          <p class="text-[10px] font-black text-slate-500 uppercase">📊 Promedio por viaje</p>
          <p id="statAvgFee" class="text-2xl font-black text-slate-900 mt-1">Q0.00</p>
        </div>
      </div>

      <!-- Carreras activas -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-black text-sm text-slate-900">🔥 Carreras en curso</h2>
          <button onclick="refreshAll()" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl">🔄 Actualizar</button>
        </div>
        <div id="activeRidesList" class="divide-y divide-slate-100">
          <p class="p-8 text-center text-sm text-slate-500">Cargando...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    (async () => {
      const session = await adminGuardPage();
      if (!session) return;
      await initAdminDeliveryNav({ user: session.user });
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      await refreshAll();

      // Realtime
      if (window.PasajeRealtime) {
        const debounced = PasajeRealtime.debounce(refreshAll, 2000);
        PasajeRealtime.subscribeToTable('admin_del_dash_req', 'delivery_requests', null, debounced);
        PasajeRealtime.subscribeToTable('admin_del_dash_drv', 'delivery_drivers', null, debounced);
      }
    })();

    async function refreshAll() {
      const c = window._supabase;
      if (!c) return;

      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
      const weekStart = new Date(now.getTime() - 7 * 24 * 3600 * 1000).toISOString();

      const [drvRes, actRes, todayRes, weekRes, dispRes] = await Promise.all([
        c.from('delivery_drivers').select('id', { count: 'exact', head: true }).eq('is_available', true),
        c.from('delivery_requests').select('id', { count: 'exact', head: true })
          .is('store_id', null)
          .in('status', ['pending','counter_offered','accepted','in_transit','on_the_way']),
        c.from('delivery_requests').select('id', { count: 'exact', head: true })
          .is('store_id', null)
          .in('status', ['delivered','completed'])
          .gte('created_at', todayStart),
        c.from('delivery_requests').select('final_fee, suggested_fee')
          .is('store_id', null)
          .in('status', ['delivered','completed'])
          .gte('created_at', weekStart),
        c.from('delivery_requests').select('id', { count: 'exact', head: true })
          .eq('status', 'cancelled_pending_review')
      ]);

      document.getElementById('statActiveDrivers').textContent = drvRes.count || 0;
      document.getElementById('statActiveRequests').textContent = actRes.count || 0;
      document.getElementById('statTodayCompleted').textContent = todayRes.count || 0;
      document.getElementById('statPendingAudit').textContent = dispRes.count || 0;

      const weekData = weekRes.data || [];
      const weekSum = weekData.reduce((s, r) => s + parseFloat(r.final_fee || r.suggested_fee || 0), 0);
      const weekCount = weekData.length;
      const avg = weekCount > 0 ? weekSum / weekCount : 0;

      const todayData = weekData.filter(r => new Date(r.created_at) >= new Date(todayStart));
      const todaySum = todayData.reduce((s, r) => s + parseFloat(r.final_fee || r.suggested_fee || 0), 0);

      document.getElementById('statTodayRevenue').textContent = `Q${todaySum.toFixed(2)}`;
      document.getElementById('statWeekRevenue').textContent = `Q${weekSum.toFixed(2)}`;
      document.getElementById('statAvgFee').textContent = `Q${avg.toFixed(2)}`;

      // Carreras activas
      const { data: rides } = await c.from('delivery_requests')
        .select(`*, driver:delivery_drivers!delivery_requests_driver_id_fkey(full_name)`)
        .is('store_id', null)
        .in('status', ['pending','counter_offered','accepted','in_transit','on_the_way'])
        .order('created_at', { ascending: false })
        .limit(20);

      const list = document.getElementById('activeRidesList');
      if (!rides || !rides.length) {
        list.innerHTML = '<p class="p-8 text-center text-sm text-slate-500">Sin carreras activas</p>';
        return;
      }

      const statusLabel = {
        'pending': '⏳ Pendiente', 'counter_offered': '🔥 Con ofertas',
        'accepted': '✅ Aceptado', 'in_transit': '🛵 En tránsito', 'on_the_way': '🛵 En camino'
      };

      list.innerHTML = rides.map(r => `
        <div class="p-4 hover:bg-slate-50 transition">
          <div class="flex justify-between items-start gap-3">
            <div class="min-w-0">
              <p class="font-mono text-[10px] text-slate-400">#${(r.id||'').slice(0,8).toUpperCase()}</p>
              <p class="font-black text-xs text-slate-900 truncate">📍 ${r.origin_address}</p>
              <p class="font-black text-xs text-slate-900 truncate">🎯 ${r.destination_address}</p>
              <p class="text-[11px] text-slate-500 mt-1">👤 ${r.customer_name || 'Cliente'} · 🛵 ${r.driver?.full_name || 'Sin piloto'}</p>
            </div>
            <div class="text-right flex-shrink-0">
              <span class="text-[10px] font-black bg-amber-100 text-amber-800 px-2 py-1 rounded-full uppercase">${statusLabel[r.status] || r.status}</span>
              <p class="font-black text-teal-600 mt-1">Q${parseFloat(r.final_fee || r.suggested_fee || 0).toFixed(2)}</p>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
