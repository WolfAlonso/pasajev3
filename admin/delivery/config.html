<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Config · Flota Express</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../img/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase.js?v=8"></script>
  <script src="../../js/theme-loader.js?v=9"></script>
  <script src="../../js/admin-utils.js?v=8"></script>
  <script src="../../js/admin-delivery-sidebar.js?v=2"></script>
  <script src="../../js/liquid-glass.js?v=4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .switch { position: relative; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; cursor: pointer; transition: .2s; }
    .switch .slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .switch input:checked + .slider { background: #10b981; }
    .switch input:checked + .slider::before { transform: translateX(20px); }
    .input-text { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 13px; background: #fff; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="adminHeader"></div>
  <main class="max-w-4xl mx-auto p-4 pb-16">
    <div id="adminTabs"></div>
    <div id="loadingState" class="rounded-2xl p-8 text-center text-sm text-slate-500 bg-white shadow-sm">Cargando configuración...</div>
    <section id="content" class="hidden space-y-5">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <h1 class="text-xl font-black text-slate-900">⚙️ Configuración de Flota</h1>
        <p class="text-xs text-slate-500 mt-1">Ajustes globales del servicio Express</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Tarifa base (Q)</label>
            <input type="number" id="cfgBaseFee" step="0.5" class="input-text">
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Tiempo de gracia cancelación (seg)</label>
            <input type="number" id="cfgGraceSec" step="10" class="input-text">
          </div>
        </div>
        <div class="rounded-2xl bg-blue-50/60 border border-blue-200 p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs font-black text-blue-900 uppercase">🌧️ Modo Lluvia</p>
              <p class="text-[11px] text-blue-700">Recargo automático en todas las tarifas</p>
            </div>
            <label class="switch">
              <input type="checkbox" id="cfgRainEnabled">
              <span class="slider"></span>
            </label>
          </div>
          <div>
            <label class="block text-[10px] font-black text-blue-800 uppercase mb-1">Recargo por lluvia (Q)</label>
            <input type="number" id="cfgRainSurcharge" step="0.5" class="input-text">
          </div>
        </div>
      </div>
      <div class="sticky bottom-4">
        <div class="bg-white rounded-2xl p-4 shadow-xl border border-slate-200 flex items-center justify-between flex-wrap gap-3">
          <div>
            <p class="font-black text-sm">¿Guardar cambios?</p>
            <p class="text-[11px] text-slate-500">Aplica al instante en el sitio público</p>
          </div>
          <button onclick="saveConfig()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs px-5 py-2.5 rounded-xl">💾 Guardar</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    (async () => {
      const session = await adminGuardPage();
      if (!session) return;
      await initAdminDeliveryNav({ user: session.user });
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      const { data } = await window._supabase.from('site_settings')
        .select('delivery_config').eq('id','global').maybeSingle();
      const dc = data?.delivery_config || {};
      document.getElementById('cfgBaseFee').value = dc.base_fee ?? 15;
      document.getElementById('cfgGraceSec').value = dc.cancellation_grace_seconds ?? 120;
      document.getElementById('cfgRainSurcharge').value = dc.rain_surcharge ?? 5;
      document.getElementById('cfgRainEnabled').checked = !!dc.rain_mode_enabled;
    })();

    async function saveConfig() {
      const payload = {
        delivery_config: {
          base_fee: parseFloat(document.getElementById('cfgBaseFee').value) || 15,
          rain_surcharge: parseFloat(document.getElementById('cfgRainSurcharge').value) || 0,
          rain_mode_enabled: document.getElementById('cfgRainEnabled').checked,
          cancellation_grace_seconds: parseInt(document.getElementById('cfgGraceSec').value, 10) || 120,
          zones: [] // preservar si lo manejas por config-modulos.html
        }
      };
      const { error } = await window._supabase.from('site_settings')
        .update(payload).eq('id','global');
      if (error) alert('Error: ' + error.message);
      else alert('✅ Guardado');
    }
  </script>
</body>
</html>
